<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Motion Studio</title>
<meta name="description" content="Imagini AI, restaurare poze vechi, animare imagini, clipuri video și reclame. Rapide, ieftine, spectaculoase.">
<meta name="theme-color" content="#0B0720">
<link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="hdr"></div>
<main>
<section class="hero">
  <div class="glow g1"></div><div class="glow g2"></div>

  <div class="wrap hero-grid">
    <div class="hero-copy">
      <p class="eyebrow">IMAGE MOTION STUDIO</p>
      <h1 data-i18n="hero.title"></h1>
      <p class="sub" data-i18n="hero.sub"></p>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="cta-row">
        <a href="contact.html" class="btn" data-i18n="hero.cta1"></a>
        <a href="portofoliu.html" class="btn ghost" data-i18n="hero.cta2"></a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="player">
        <div class="player-bar"><i></i><i></i><i></i></div>

        <div class="timeline"><span></span></div>
      </div>
    </div>
  </div>

  <h2 data-i18n="home.srv"></h2>
  <div class="cards" id="srvCards"></div>

</div></section>
<section class="sec alt"><div class="wrap">
  <h2 data-i18n="home.port"></h2>

  <div class="reels" id="reels" data-count="4"></div>
  <p class="more"><a class="btn ghost" href="portofoliu.html" data-i18n="home.portMore"></a></p>
</div></section>
<section class="sec"><div class="wrap">
  <h2 data-i18n="home.proc"></h2>
  <div class="steps" id="procMini"></div>
  <p class="more"><a class="btn ghost" href="cum-lucram.html" data-i18n="home.procMore"></a></p>
</div></section>
<section class="sec cta" id="cta"></section>
</main>
<div id="ftr"></div>
<script src="script.js"></script>
